red = "#D35F5F"
yellow = "#b91c1c"
orange = "#c63d3d"
green = "#FFC107"
cyan = "#bebebe"
blue = "#e68e0d"
magenta = "#D35F5F"
brown = "#631e1e"

bright_red = "#B91C1C"
bright_yellow = "#b90a0a"
bright_green = "#FFC107"
bright_cyan = "#eaeaea"
bright_blue = "#f59e0b"
bright_magenta = "#B91C1C"

# Loupe roles: colors from or near this palette that keep Claude, OpenAI, Grok,
# Gemini, "needs you" and the warning apart. See docs/themes.md.
warn   = "#e68e0d"   # the yellow the dashboard would pick sits too close to its red
claude = "#dbc63f"
openai = "#b6e5c1"
grok   = "#9881ae"
gemini = "#308aec"
