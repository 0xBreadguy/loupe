# Matte Black, from Omarchy: themes/matte-black/colors.toml in github.com/omacom/omarchy
# (MIT, commit 3f974d011). Omarchy's file is copied unchanged down to the roles below.

mode = "dark"

accent = "#e68e0d"
selection = "#2a2a2a"
muted = "#333333"

background = "#121212"
dark_background = "#0d0d0d"
darker_background = "#090909"
lighter_background = "#1e1e1e"

foreground = "#bebebe"
dark_foreground = "#555555"
light_foreground = "#8a8a8d"
