[workspace]
resolver = "3"
members = ["crates/core", "crates/term"]

[workspace.package]
version = "1.6.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
rusqlite = { version = "0.43", features = ["blob", "bundled", "functions"] }

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false
