name: test

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand: Actions tab, then "test", then "Run workflow", or
  #   gh workflow run test.yml --ref BRANCH
  # That runs the two Linux jobs on any branch. The macOS and Windows jobs below run only
  # when their box is ticked, until someone turns them on, and the Linux jobs can be left out:
  #   gh workflow run test.yml --ref BRANCH -f linux=false -f macos=true
  # On a private repository GitHub bills a macOS minute as ten Linux minutes and a Windows
  # minute as two.
  workflow_dispatch:
    inputs:
      linux:
        description: Run the two Linux jobs
        type: boolean
        default: true
      macos:
        description: Run the unverified macOS job
        type: boolean
        default: false
      windows:
        description: Run the unverified Windows job
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # OpenTUI's native core runs through Node's FFI, new in 26.4.
          node-version: 26
          cache: npm
          cache-dependency-path: oracle/package-lock.json
      - name: Dashboard tests and type check
        working-directory: oracle
        run: |
          npm ci
          npm test
          npm run check
      - name: Bar widget tests
        run: node --test test/

  rust:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: oracle/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: tmux, for the real-terminal gate
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Rust workspace and parity gates
        run: checks/scripts/ci.sh

  # macOS and Windows. Neither is supported yet, and the repository's author has no machine for
  # either. They compile the Rust workspace for the runner's own target and run its tests.
  # macOS, as of 2026-11-17: everything compiles, the core's tests pass, and inside tmux the
  # presenter draws the recorded screens; its PTY tests hang and its exit tests do not start.
  # Windows has never run.
  #
  # Each runs only when started by hand with its box ticked. To turn one on for every push and
  # pull request, delete its `if:` line. To make its tests blocking once they are green, delete
  # the `continue-on-error` line on the test step.
  #
  # What each can show:
  #   check  The tree type-checks for that OS: the platform modules, the Windows stubs and, on
  #          macOS, the pipe, pselect and ioctl code the presenter runs.
  #   test   The unit tests that can run there. On macOS that includes the presenter's PTY
  #          harness, including the idle-CPU test that catches a wait which spins. On Windows
  #          the PTY harness is compiled out (no openpty) and the presenter is a stub.
  # Neither runs the parity gates: they compare against the Node app and need tmux.
  portability-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    # The PTY tests hang here (2026-11-17). A minute on this runner is billed as ten.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      # Nothing here may reach a real T3 database. The runner has none; this makes it explicit.
      # (A job-level `env:` cannot name the runner's temporary folder, so a step sets it.)
      - name: Point T3CODE_HOME at an empty folder
        shell: bash
        run: echo "T3CODE_HOME=$RUNNER_TEMP/t3-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Show the toolchain and target
        shell: bash
        run: rustc -Vv
      - name: cargo check
        shell: bash
        run: cargo check --locked --all-targets
      - name: tmux, for the recorded real-terminal check
        shell: bash
        run: brew install tmux && tmux -V
      - name: cargo test
        # Not yet green on this OS: one presenter test reads a fixture only the Linux job generates
        # (it needs Node and the original app). Every other test is expected to pass. Delete the
        # next line once the step has gone green.
        continue-on-error: true
        shell: bash
        run: cargo test --release --locked --no-fail-fast

  portability-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Point T3CODE_HOME at an empty folder
        shell: bash
        run: echo "T3CODE_HOME=$RUNNER_TEMP/t3-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Show the toolchain and target
        shell: bash
        run: rustc -Vv
      - name: cargo check
        shell: bash
        run: cargo check --locked --all-targets
      - name: cargo test
        # Unverified on this OS. Delete this line once the step has gone green.
        continue-on-error: true
        shell: bash
        run: cargo test --release --locked
