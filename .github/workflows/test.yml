name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # OpenTUI's native core runs through Node's FFI, new in 26.4.
          node-version: 26
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard tests and type check
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run check
      - name: Bar widget tests
        run: node --test test/
